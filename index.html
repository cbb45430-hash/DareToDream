<!DOCTYPE html><html><head><meta charset='utf-8'/><style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;display:flex;justify-content:center;align-items:center;}
/* 💡 キャンバスを画面（プリムの面）いっぱいに100%強制拡大します */
canvas{width:100vw;height:100vh;display:block;cursor:none;}
</style></head><body>
<canvas id='g'></canvas><script>
const c=document.getElementById('g'),ctx=c.getContext('2d');

// 💡 画面サイズをSLのブラウザ解像度に合わせて動的にリサイズする関数
function resizeCanvas() {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas(); // 初回実行

// 💡 比率が変わっても壊れないように、すべての配置をCanvasの幅・高さからの相対％で管理します
let pw, ph, px, br, x, y, dx, dy;
let rows=5, cols=10, bw, bh, pad, offT, offL, score=0, over=false, bricks=[];

function initGame() {
    pw = c.width * 0.15;               // パドルの幅は画面の15%
    ph = 15;
    px = (c.width - pw) / 2;
    br = 10;
    x = c.width / 2;
    y = c.height - 40;
    dx = c.width * 0.005;              // 速度も画面サイズに比例
    dy = -c.height * 0.01;
    
    pad = c.width * 0.01;              // 隙間
    offT = c.height * 0.1;             // 上部余白
    offL = c.width * 0.04;             // 左側余白
    bw = (c.width - (offL * 2) - (pad * (cols - 1))) / cols; // ブロック幅を自動計算
    bh = c.height * 0.04;              // ブロック高さ
    
    bricks = [];
    for (let i = 0; i < cols; i++) {
        bricks[i] = [];
        for (let j = 0; j < rows; j++) bricks[i][j] = {x:0,y:0,s:1};
    }
}
initGame();

function move(e){
    let rect=c.getBoundingClientRect(), scaleX=c.width/rect.width;
    let rx=((e.clientX||e.touches.clientX)-rect.left)*scaleX;
    if(!over&&rx>0&&rx<c.width)px=rx-pw/2;
}
window.addEventListener('mousemove',move);window.addEventListener('touchmove',move);
window.addEventListener('click',()=>{if(over){over=false;score=0;initGame();}});

function loop() {
    // 💡 画面全体（SLブラウザの全領域）を真っ黒に塗りつぶして、右側の砂嵐バグを完全に消去！
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, c.width, c.height);
    
    let activeBricks=0;
    ctx.textAlign='left';
    
    for(let i=0;i<cols;i++){
        for(let j=0;j<rows;j++){
            let b=bricks[i][j];
            if(b.s==1){
                b.x=(i*(bw+pad))+offL; b.y=(j*(bh+pad))+offT; activeBricks++;
                ctx.fillStyle='hsl('+(j*40)+',100%,50%)';
                ctx.fillRect(b.x,b.y,bw,bh);
                if(!over&&x>b.x&&x<b.x+bw&&y>b.y&&y<b.y+bh){dy=-dy;b.s=0;score+=10;}
            }
        }
    }
    
    ctx.fillStyle='#ffffff';
    ctx.fillRect(px, c.height - ph - 15, pw, ph);
    
    ctx.beginPath();
    ctx.arc(x,y,br,0,6.28);
    ctx.fillStyle='#ff0055';
    ctx.fill();
    
    ctx.fillStyle='#fff';
    ctx.font='20px sans-serif';
    ctx.fillText('SCORE: '+score, 20, 35);
    
    if(activeBricks==0){
        ctx.fillStyle='#00ffcc';
        ctx.font='50px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('STAGE CLEAR!', c.width/2, c.height/2);
        over=true;
    }
    if(!over){
        if(x+dx>c.width-br||x+dx<br)dx=-dx;
        if(y+dy<br)dy=-dy;
        else if(y+dy>c.height-br-20){
            if(x>px&&x<px+pw){let hit=(x-(px+pw/2))/(pw/2);dx=hit*8;dy=-Math.sqrt(64-dx*dx);}
            else{over=true;}
        }
        x+=dx;y+=dy;
    }
    if(over&&activeBricks>0){
        ctx.fillStyle='#ff3333';
        ctx.font='50px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('GAME OVER', c.width/2, c.height/2-20);
        ctx.font='24px sans-serif';
        ctx.fillText('Click to Restart', c.width/2, c.height/2+30);
    }
}

// SLで最も安定する30msタイマー
setInterval(loop, 30);
</script></body></html>
