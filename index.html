<!DOCTYPE html><html><head><meta charset='utf-8'/><style>
html,body{margin:0;padding:0;background:#000;overflow:hidden;width:100%;height:100%;display:flex;justify-content:center;align-items:center;}
/* 💡 画面サイズを完全に強制固定し、ズレを防止します */
canvas{width:100vw;height:100vh;object-fit:fill;border:none;box-shadow:none;cursor:none;display:block;}
</style></head><body>
<canvas id='g' width='1200' height='600'></canvas><script>
const c=document.getElementById('g'),ctx=c.getContext('2d');
let pw=180,ph=15,px=(c.width-pw)/2,br=10,x=c.width/2,y=c.height-40,dx=6,dy=-6;
let rows=5,cols=10,bw=100,bh=25,pad=12,offT=60,offL=45,score=0,over=false,bricks=[];
function initBricks(){for(let i=0;i<cols;i++){bricks[i]=[];for(let j=0;j<rows;j++)bricks[i][j]={x:0,y:0,s:1};}}
initBricks();
function move(e){let rect=c.getBoundingClientRect(),scaleX=c.width/rect.width;
let rx=((e.clientX||e.touches.clientX)-rect.left)*scaleX;
if(!over&&rx>0&&rx<c.width)px=rx-pw/2;}
window.addEventListener('mousemove',move);window.addEventListener('touchmove',move);
window.addEventListener('click',()=>{if(over){over=false;score=0;x=c.width/2;y=c.height-40;dx=6;dy=-6;px=(c.width-pw)/2;initBricks();}});

// 💡 描画と更新をひとつの関数に完全にまとめます
function loop() {
    // 💡 毎フレーム完全に画面を塗りつぶし、右側の点々バグを強制リセットします
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, c.width, c.height);
    
    let activeBricks=0;
    ctx.textAlign='left';
    
    for(let i=0;i<cols;i++){
        for(let j=0;j<rows;j++){
            let b=bricks[i][j];
            if(b.s==1){
                b.x=(i*(bw+pad))+offL;b.y=(j*(bh+pad))+offT;activeBricks++;
                ctx.fillStyle='hsl('+(j*40)+',100%,50%)';
                ctx.fillRect(b.x,b.y,bw,bh);
                if(!over&&x>b.x&&x<b.x+bw&&y>b.y&&y<b.y+bh){dy=-dy;b.s=0;score+=10;}
            }
        }
    }
    
    // パドルの位置を計算（c.heightからの相対位置に修正してズレを防止）
    ctx.fillStyle='#ffffff';
    ctx.fillRect(px, c.height - ph - 15, pw, ph);
    
    ctx.beginPath();
    ctx.arc(x,y,br,0,6.28);
    ctx.fillStyle='#ff0055';
    ctx.fill();
    
    ctx.fillStyle='#fff';
    ctx.font='20px sans-serif';
    ctx.fillText('SCORE: '+score,20,35);
    
    if(activeBricks==0){
        ctx.fillStyle='#00ffcc';
        ctx.font='50px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('STAGE CLEAR!',c.width/2,c.height/2);
        over=true;
    }
    if(!over){
        if(x+dx>c.width-br||x+dx<br)dx=-dx;
        if(y+dy<br)dy=-dy;
        else if(y+dy>c.height-br-20){
            if(x>px&&x<px+pw){let hit=(x-(px+pw/2))/(pw/2);dx=hit*8;dy=-Math.sqrt(64-dx*dx);}
            else{over=true;}
        }
        x+=dx;y+=dy;
    }
    if(over&&activeBricks>0){
        ctx.fillStyle='#ff3333';
        ctx.font='50px sans-serif';
        ctx.textAlign='center';
        ctx.fillText('GAME OVER',c.width/2,c.height/2-20);
        ctx.font='24px sans-serif';
        ctx.fillText('Click to Restart',c.width/2,c.height/2+30);
    }
}

// 💡 SLブラウザで最も安定する固定タイマー（30ミリ秒間隔＝約33FPS）に変更
setInterval(loop, 30);
</script></body></html>
