<!DOCTYPE html><html><head><meta charset='utf-8'/><style>
body{margin:0;background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#111;border:3px solid #00ffcc;box-shadow:0 0 20px #00ffcc;cursor:none;}
</style></head><body><canvas id='g' width='800' height='600'></canvas><script>
const c=document.getElementById('g'),ctx=c.getContext('2d');
let pw=130,ph=15,px=(c.width-pw)/2,br=10,x=c.width/2,y=c.height-40,dx=5,dy=-5;
let rows=5,cols=8,bw=85,bh=25,pad=10,offT=60,offL=30,score=0,over=false,bricks=[];
for(let i=0;i<cols;i++){bricks[i]=[];for(let j=0;j<rows;j++)bricks[i][j]={x:0,y:0,s:1};}
function move(e){let rect=c.getBoundingClientRect(),rx=(e.clientX||e.touches.clientX)-rect.left;
if(rx>0&&rx<c.width)px=rx-pw/2;if(over){over=false;document.location.reload();}}
window.addEventListener('mousemove',move);window.addEventListener('touchmove',move);
window.addEventListener('click',()=>{if(over){over=false;document.location.reload();}});
function draw(){ctx.clearRect(0,0,c.width,c.height);let activeBricks=0;
for(let i=0;i<cols;i++){for(let j=0;j<rows;j++){let b=bricks[i][j];if(b.s==1){
b.x=(i*(bw+pad))+offL;b.y=(j*(bh+pad))+offT;activeBricks++;ctx.fillStyle='hsl('+(j*40)+',100%,50%)';ctx.fillRect(b.x,b.y,bw,bh);
if(x>b.x&&x<b.x+bw&&y>b.y&&y<b.y+bh){dy=-dy;b.s=0;score+=10;}}}}
ctx.fillStyle='#ffffff';ctx.fillRect(px,c.height-ph-15,pw,ph);
ctx.beginPath();ctx.arc(x,y,br,0,6.28);ctx.fillStyle='#ff0055';ctx.fill();
ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('SCORE: '+score,20,35);
if(activeBricks==0){ctx.fillStyle='#00ffcc';ctx.font='50px sans-serif';ctx.textAlign='center';ctx.fillText('STAGE CLEAR!',c.width/2,c.height/2);over=true;return;}
if(x+dx>c.width-br||x+dx<br)dx=-dx;if(y+dy<br)dy=-dy;
else if(y+dy>c.height-br-20){if(x>px&&x<px+pw){let hit=(x-(px+pw/2))/(pw/2);dx=hit*7;dy=-Math.sqrt(50-dx*dx);}
else{ctx.fillStyle='#ff3333';ctx.font='50px sans-serif';ctx.textAlign='center';
ctx.fillText('GAME OVER',c.width/2,c.height/2-20);ctx.font='24px sans-serif';ctx.fillText('Click to Restart',c.width/2,c.height/2+30);over=true;return;}}
x+=dx;y+=dy;requestAnimationFrame(draw);}draw();</script></body></html>
